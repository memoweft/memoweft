<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="An abstract MemoWeft memory weave: solid gold evidence, hollow teal inference, and paired coral conflicts move from loose signals into an organized fabric.">
  <defs>
