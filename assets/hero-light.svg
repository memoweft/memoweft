      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset=".58" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#E8F3F0"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
