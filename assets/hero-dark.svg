<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="An abstract MemoWeft memory weave: solid gold evidence, hollow teal inference, and paired coral conflicts move from loose signals into an organized fabric.">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100E0B"/>
      <stop offset="0.58" stop-color="#18130F"/>
      <stop offset="1" stop-color="#102122"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E6B46E" stop-opacity=".34"/>
      <stop offset="1" stop-color="#E6B46E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7BC9C0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7BC9C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldThread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1C785"/>
      <stop offset="1" stop-color="#C98C3D"/>
    </linearGradient>
    <linearGradient id="tealThread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74C7BE" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#8DDBD0" stop-opacity=".82"/>
      <stop offset="1" stop-color="#54A79F" stop-opacity=".34"/>
    </linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#FFF5E2" opacity=".035"/>
      <circle cx="20" cy="17" r=".55" fill="#7BC9C0" opacity=".035"/>
    </pattern>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#background)"/>
  <rect width="1280" height="560" fill="url(#grain)"/>

  <!-- quiet field behind the fabric -->
  <ellipse cx="917" cy="277" rx="414" ry="274" fill="url(#tealGlow)" filter="url(#soften)"/>
  <ellipse cx="786" cy="290" rx="280" ry="225" fill="url(#goldGlow)" filter="url(#soften)"/>

  <!-- loose, individually traceable incoming signals -->
  <g fill="none" stroke-linecap="round">
    <path d="M72 116 C202 88 292 180 494 186 S630 165 687 204" stroke="#E6B46E" stroke-width="2" opacity=".67"/>
    <path d="M86 242 C211 198 315 274 464 253 S602 260 698 274" stroke="#76C9C0" stroke-width="2" stroke-dasharray="4 10" opacity=".66"/>
    <path d="M66 385 C176 429 312 330 471 361 S593 407 705 390" stroke="#E6B46E" stroke-width="2" opacity=".53"/>
    <path d="M164 488 C296 405 392 462 514 438 S630 451 715 436" stroke="#76C9C0" stroke-width="1.7" stroke-dasharray="3 9" opacity=".48"/>
    <path d="M208 61 C316 130 365 96 484 123 S597 133 686 151" stroke="#76C9C0" stroke-width="1.5" stroke-dasharray="3 11" opacity=".40"/>
  </g>

  <!-- evidence: deliberately solid gold points -->
  <g fill="#F0BE78">
    <circle cx="72" cy="116" r="7"/>
    <circle cx="66" cy="385" r="6"/>
    <circle cx="294" cy="166" r="6"/>
    <circle cx="471" cy="361" r="6"/>
    <circle cx="514" cy="438" r="5"/>
  </g>
  <g fill="#F0BE78" opacity=".19">
    <circle cx="72" cy="116" r="18"/>
    <circle cx="66" cy="385" r="17"/>
    <circle cx="294" cy="166" r="15"/>
  </g>

  <!-- inference: visibly hollow teal points -->
  <g fill="#151C1B" stroke="#83D4CA" stroke-width="3">
    <circle cx="86" cy="242" r="8"/>
    <circle cx="208" cy="61" r="7"/>
    <circle cx="164" cy="488" r="7"/>
    <circle cx="464" cy="253" r="7"/>
    <circle cx="484" cy="123" r="6"/>
  </g>

  <!-- unresolved alternatives stay paired instead of being merged -->
  <g fill="none" stroke="#E78270" stroke-width="2.5" opacity=".95">
    <path d="M353 287 C370 272 389 272 405 287"/>
    <circle cx="353" cy="287" r="6"/>
    <circle cx="405" cy="287" r="6"/>
    <path d="M555 86 C571 71 590 71 606 86"/>
    <circle cx="555" cy="86" r="5.5"/>
    <circle cx="606" cy="86" r="5.5"/>
  </g>

  <!-- an orderly cloth begins after the raw signals have been held apart -->
  <g fill="none" stroke="url(#tealThread)" stroke-linecap="round">
    <path d="M604 104 C758 76 930 124 1218 92" stroke-width="3.2"/>
    <path d="M594 154 C763 124 961 177 1234 146" stroke-width="3.2"/>
    <path d="M614 204 C789 176 950 230 1223 197" stroke-width="3.2"/>
    <path d="M603 254 C756 225 968 280 1238 246" stroke-width="3.2"/>
    <path d="M613 304 C786 276 951 330 1218 296" stroke-width="3.2"/>
    <path d="M606 354 C766 326 971 380 1234 347" stroke-width="3.2"/>
    <path d="M616 404 C779 377 952 429 1224 397" stroke-width="3.2"/>
    <path d="M625 454 C787 428 965 479 1210 449" stroke-width="3.2"/>
  </g>

  <!-- warm warp threads, alternating above and below the teal weft -->
  <g fill="none" stroke="url(#goldThread)" stroke-linecap="round">
    <path d="M690 61 C677 168 709 202 691 279 S703 421 688 503" stroke-width="4.2" opacity=".88"/>
    <path d="M754 53 C772 143 737 213 758 296 S740 430 759 510" stroke-width="3.4" opacity=".72"/>
    <path d="M820 58 C802 151 839 214 818 298 S840 430 823 510" stroke-width="4.2" opacity=".93"/>
    <path d="M890 50 C910 137 871 212 892 288 S876 425 895 508" stroke-width="3.4" opacity=".72"/>
    <path d="M960 57 C940 150 976 212 958 295 S979 429 961 510" stroke-width="4.2" opacity=".91"/>
    <path d="M1033 53 C1052 143 1017 215 1037 295 S1020 430 1040 507" stroke-width="3.4" opacity=".70"/>
    <path d="M1106 60 C1085 153 1123 215 1104 295 S1124 425 1107 503" stroke-width="4.2" opacity=".86"/>
    <path d="M1176 64 C1194 149 1160 217 1180 294 S1164 419 1181 496" stroke-width="3.4" opacity=".68"/>
  </g>

  <!-- distinct records remain readable inside the finished weave -->
  <g>
    <circle cx="820" cy="204" r="22" fill="url(#goldGlow)"/>
    <circle cx="820" cy="204" r="7" fill="#F1C785"/>
    <circle cx="960" cy="304" r="22" fill="url(#tealGlow)"/>
    <circle cx="960" cy="304" r="8" fill="#142321" stroke="#91DED4" stroke-width="3"/>
    <circle cx="1107" cy="397" r="19" fill="url(#goldGlow)"/>
    <circle cx="1107" cy="397" r="6" fill="#F1C785"/>
    <g fill="none" stroke="#E78270" stroke-width="2.8">
      <path d="M1016 189 C1031 174 1050 174 1066 189"/>
      <circle cx="1016" cy="189" r="6"/>
      <circle cx="1066" cy="189" r="6"/>
    </g>
  </g>

  <path d="M603 104 L603 454" stroke="#F1C785" stroke-width="1" opacity=".38" stroke-dasharray="2 9"/>
</svg>
